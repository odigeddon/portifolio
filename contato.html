<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caique Moura - Contato</title>
    <link rel="icon" type="icon" href="imgs/navi.ico">
    <link rel="stylesheet" href="cstyle.css">
</head>
<body>

    <header>
        <div class="logo">
            <div class="logo-dot"></div>
            <a href="index.html">kiq</a>
        </div>
        <nav>
            <a href="index.html">[sobre]</a>
            <a href="index.html">[projetos]</a>
        </nav>
    </header>

    <main class="contato">
        <h1>[ Contato ]</h1>
        <form>
            <label for="nome">Nome</label>
            <input id="nome" name="nome" type="text" autocomplete="name" placeholder="Seu nome" required>

            <label for="telefone">Telefone</label>
            <input id="telefone" name="telefone" type="tel" autocomplete="tel" inputmode="tel" placeholder="(11) 91111-1111" maxlength="15" required>

            <label for="mensagem">Mensagem</label>
            <textarea id="mensagem" name="mensagem" rows="5" required></textarea>

            <button type="submit">Enviar</button>
        </form>
    </main>

    <script src="contato.js" defer></script>
</body>
</html>
